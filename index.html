const DB_BOOTSTRAP="const DB_NAME = 'autojournal-db';\nconst DB_VERSION = 1;\nconst STORE = 'kv';\nconst STATE_KEY = 'app-state';\nfunction openDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(STORE))db.createObjectStore(STORE)};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}\nasync function loadState(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readonly');const req=tx.objectStore(STORE).get(STATE_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error);});}\nasync function saveState(state){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,STATE_KEY);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}\nasync function clearState(){const db=await openDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).delete(STATE_KEY);tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);});}";
async function gunzipBase64(b64){
  const binary=atob(b64);const bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  if(!('DecompressionStream' in window))throw new Error('Для запуска требуется актуальная версия iOS/Safari.');
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
}

  if(source===rawSource)throw new Error('Не удалось подготовить приложение.');
  new Function('"use strict";\n'+DB_BOOTSTRAP+'\n'+source)();
}
