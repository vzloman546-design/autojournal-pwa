name: AutoJournal PDF Smoke
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app.js'
      - 'index.html'
      - 'sw.js'
      - 'vendor/**'
      - 'tests/app.spec.cjs'
      - 'playwright.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pdf-smoke.yml'
jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test -g "PDF"
