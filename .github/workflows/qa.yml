name: AutoJournal QA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app.js'
      - 'styles.css'
      - 'index.html'
      - 'sw.js'
      - 'db.js'
      - 'cloudflare/schema.sql'
      - 'cloudflare/src/worker.js'
      - 'vendor/jsQR.js'
      - 'vendor/qrcode.mjs'
      - 'sync-config.js'
      - 'sync.js'
      - 'manifest.webmanifest'
      - 'tests/app.spec.cjs'
      - 'tests/server.cjs'
      - 'playwright.config.cjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/qa.yml'
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm test
