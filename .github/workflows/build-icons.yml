name: Build AutoJournal icons
on:
  push:
    paths:
      - 'scripts/generate_pwa_icons.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render selected Apple-style light/dark icons
        run: |
          python -m pip install Pillow
          python scripts/generate_pwa_icons.py
      - name: Publish PWA icon assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/
          if git diff --cached --quiet; then
            echo "Icons already up to date"
          else
            git commit -m "Install selected AutoJournal light and dark PWA icons"
            git push
          fi
